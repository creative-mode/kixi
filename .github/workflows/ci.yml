name: CI

on:
  push:
    branches:
      - prod
      - qua
      - dev
  pull_request:
    branches:
      - prod
      - dev

permissions:
  contents: read

jobs:
  caddy-config:
    name: Caddy configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Caddyfile (Caddy 2.10+)
        run: >-
          docker run --rm
          -v "$PWD/infra/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2
          caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate

  hygiene:
    name: Higiene de texto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Encoding e indentação. Nenhum dos dois falha o build, e ambos já
      # passaram por revisão humana: os bytes de U+2500 reinterpretados como
      # Latin-1 ao resolver conflitos, e membros encostados à coluna zero.
      - name: Verificar encoding e indentação
        run: node .github/scripts/text-hygiene.js

      # O checker novo tem de se manter honesto: um teste que passa sem
      # apanhar nada é pior do que nenhum teste.
      - name: Testar os scripts
        run: |
          node --test .github/scripts/bots.test.js
          node --test .github/scripts/text-hygiene.test.js
          node --test .github/scripts/release-notes.test.js

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kixi_exam_room_it
          POSTGRES_USER: kixi
          POSTGRES_PASSWORD: kixi_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kixi -d kixi_exam_room_it"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/backend-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests
        env:
          KIXI_POSTGRES_TESTS: 'true'
          KIXI_POSTGRES_HOST: localhost
          KIXI_POSTGRES_PORT: '5432'
          KIXI_POSTGRES_DATABASE: kixi_exam_room_it
          KIXI_POSTGRES_USER: kixi
          KIXI_POSTGRES_PASSWORD: kixi_secret
        shell: bash
        run: ./mvnw -B test 2>&1 | tee "$RUNNER_TEMP/mvn.log"

      # O registo completo do job não é descarregável por quem usa só a API; as linhas de erro
      # do Maven passam a anotações, que se leem na página da verificação.
      - name: Erros do Maven em anotações
        if: failure()
        shell: bash
        run: |
          grep -E "^\[ERROR\]" "$RUNNER_TEMP/mvn.log" | head -40 | while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done

  ocr:
    name: OCR tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ocr-service
    env:
      DEBUG: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/ocr-service/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run deterministic OCR tests
        run: python -m pytest -m 'not slow and not integration' --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
