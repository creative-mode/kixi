name: CI

on:
  push:
    branches:
      - prod
      - dev
  pull_request:
    branches:
      - prod
      - dev

permissions:
  contents: read

jobs:
  hygiene:
    name: Higiene de texto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Encoding e indentação. Nenhum dos dois falha o build, e ambos já
      # passaram por revisão humana: os bytes de U+2500 reinterpretados como
      # Latin-1 ao resolver conflitos, e membros encostados à coluna zero.
      - name: Verificar encoding e indentação
        run: node .github/scripts/text-hygiene.js

      # O checker novo tem de se manter honesto: um teste que passa sem
      # apanhar nada é pior do que nenhum teste.
      - name: Testar os scripts
        run: |
          node --test .github/scripts/bots.test.js
          node --test .github/scripts/text-hygiene.test.js

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests
        run: ./mvnw -B test

  ocr:
    name: OCR tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ocr-service
    env:
      DEBUG: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/ocr-service/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run deterministic OCR tests
        run: python -m pytest -m 'not slow and not integration' --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
