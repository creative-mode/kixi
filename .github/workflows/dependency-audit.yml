name: Auditoria mensal de dependências

on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ocr-python:
    name: Dependências Python do OCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit resolved dependency graph
        continue-on-error: true
        run: |
          set +e
          {
            echo '### Python OCR dependency audit'
            echo
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"
          pip-audit -r services/ocr-service/requirements.txt 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          {
            echo '```'
            echo
            echo "Audit exit status: $status (the scheduled audit is non-blocking by design)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
