name: Alerta de bloqueio

# Quando uma issue é fechada — ou o PR que a fecha faz merge — avisa as issues que dependiam
# dela ("## 🔗 Depende de"). Como os PRs vão para dev, é o merge que fecha a issue.
# Para avisar issues do OUTRO repositório, cria o secret CROSS_REPO_TOKEN
# (token com escrita em Issues nos dois repositórios).
# Nota: o evento "issues" corre a partir da branch por defeito; "pull_request" a partir da base do PR.

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  alert:
    name: Avisar issues desbloqueadas
    if: github.event_name == 'issues' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          script: |
            await require('./.github/scripts/dependency-alert.js')({ github, context, core });
