# Análise automática de dependências (kixi#452). Os PRs vão para `dev`, como todos os outros, e o `pr-check` deixa passar os de bots.
# Semanal e com limite de PRs abertos, para não afogar a revisão: o Spring Boot e o Flyway sobem em bloco com o BOM, por isso agrupam-se.
version: 2
updates:
  - package-ecosystem: maven
    directory: /services/backend-api
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies, area:backend]
    commit-message: { prefix: "chore(deps)" }
    groups:
      spring:
        patterns: ["org.springframework*", "org.flywaydb*", "org.springdoc*"]
      # As três peças do jjwt (api, impl, jackson) têm de ter a mesma versão: sobem num só PR.
      jjwt:
        patterns: ["io.jsonwebtoken*"]
    # Um major é uma migração (API, testes, propriedades), não um bump: faz-se à mão, num PR próprio.
    # Ver kixi#477 (Spring Boot 3 → 4) e kixi#558 (pdfbox 2 → 3), que não compilam.
    ignore:
      - dependency-name: "org.springframework*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.apache.pdfbox*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /services/ocr-service
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [dependencies, area:ocr]
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    labels: [dependencies, devops]
    commit-message: { prefix: "chore(ci)" }
  - package-ecosystem: docker
    directory: /infra/docker
    target-branch: dev
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    labels: [dependencies, devops]
    commit-message: { prefix: "chore(deps)" }
    # A imagem do OCR só sobe de Python quando o paddlepaddle/paddleocr publicam wheels para essa versão
    # e o ocr-integration corre nela (kixi#552: o CI usa 3.11 e não constrói a imagem).
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
